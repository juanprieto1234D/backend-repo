sonar.projectKey=taskup-backend
sonar.projectName=TaskUp Backend
sonar.projectVersion=1.0.0

# Ruta del código fuente
sonar.sources=src

# Excluir carpetas que no queremos analizar
sonar.exclusions=**/node_modules/**, **/dist/**, **/coverage/**, **/__tests__/**

# Configuración para leer el reporte de cobertura de Jest
sonar.sourceEncoding=UTF-8
sonar.typescript.lcov.reportPaths=coverage/lcov.info